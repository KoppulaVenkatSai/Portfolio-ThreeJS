<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earth Descent & Monolith Landing POC</title>
  <script>
    window.addEventListener('error', function(e) {
      var div = document.createElement('div');
      div.style.position = 'fixed';
      div.style.top = '0';
      div.style.left = '0';
      div.style.width = '100%';
      div.style.background = 'red';
      div.style.color = 'white';
      div.style.zIndex = '99999';
      div.style.padding = '20px';
      div.style.fontFamily = 'monospace';
      div.style.whiteSpace = 'pre-wrap';
      div.innerHTML = '<h2>Runtime Error:</h2>' + e.message + '\\nat ' + e.filename + ':' + e.lineno + ':' + e.colno + '\\nStack: ' + (e.error ? e.error.stack : 'N/A');
      document.body.appendChild(div);
    });
    window.addEventListener('unhandledrejection', function(e) {
      var div = document.createElement('div');
      div.style.position = 'fixed';
      div.style.top = '0';
      div.style.left = '0';
      div.style.width = '100%';
      div.style.background = 'darkred';
      div.style.color = 'white';
      div.style.zIndex = '99999';
      div.style.padding = '20px';
      div.style.fontFamily = 'monospace';
      div.style.whiteSpace = 'pre-wrap';
      div.innerHTML = '<h2>Unhandled Promise Rejection:</h2>' + e.reason + '\\nStack: ' + (e.reason && e.reason.stack ? e.reason.stack : 'N/A');
      document.body.appendChild(div);
    });
  </script>
  <link rel="stylesheet" href="./style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Loading overlay -->
  <div id="loading-overlay">
    <div class="loader-content">
      <div class="loader-title">System Preload</div>
      <div class="progress-bar-container">
        <div id="progress-bar"></div>
      </div>
      <div class="loader-status" id="loader-status">Initializing WebGL context...</div>
    </div>
  </div>

  <!-- Storm fullscreen lightning / flash overlay -->
  <div id="storm-overlay"></div>

  <!-- WebGL Canvas Container -->
  <div id="canvas-container">
    <canvas class="canvas"></canvas>
  </div>

  <!-- UI Overlay -->
  <div id="ui-container">
    <header>
      <h1>Descent Sequence POC</h1>
      <p id="telemetry">ORBIT RANGE: 342 KM // COORD: ALPHA_STAGE</p>
    </header>

    <div class="control-panel">
      <button class="descent-btn" id="descent-btn" style="display: none;">Initiate Descent</button>
    </div>
  </div>

  <!-- Entry Script -->
  <script type="module" src="./main.js"></script>
</body>
</html>
