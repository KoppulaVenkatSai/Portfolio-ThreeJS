<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earth Descent & Monolith Landing: POC V3</title>
  <link rel="stylesheet" href="./style.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <script>
    window.addEventListener('error', function(e) {
      var div = document.createElement('div');
      div.className = 'runtime-error-popup';
      div.innerHTML = '<h3>System Malfunction</h3>' + e.message + '<br><small>' + e.filename + ':' + e.lineno + '</small>';
      document.body.appendChild(div);
    });
  </script>
</head>
<body>
  <!-- Cinematic Loader -->
  <div id="loader-screen">
    <div class="loader-matrix">
      <div class="loader-title">POC_V3 // SYSTEM INITIALIZATION</div>
      <div class="loader-bar-bg">
        <div id="loader-bar"></div>
      </div>
      <div id="loader-status">Preloading WebGL and assets...</div>
    </div>
  </div>

  <!-- WebGL Render Canvas -->
  <div id="viewport-container">
    <canvas id="webgl-canvas"></canvas>
  </div>

  <!-- Storm lightning overlay -->
  <div id="storm-overlay"></div>

  <!-- Sci-Fi HUD HUD Telemetry Overlay -->
  <div id="hud-container">
    <!-- Unified Top HUD Status Bar -->
    <div class="hud-top-bar">
      <!-- Left: System & Scene Status -->
      <div class="hud-top-section system-info">
        <div class="hud-title">V3_DESCENT_SYSTEM</div>
        <div id="hud-telemetry" class="hud-status">STANDBY // READY FOR IGNITION</div>
      </div>
      
      <!-- Center: Timeline Tracker -->
      <div class="hud-top-section timeline-info">
        <div class="hud-timeline-track">
          <div id="hud-timeline-progress"></div>
          <div id="hud-timeline-marker"></div>
          
          <!-- Segment Indicators -->
          <div class="hud-timeline-step" style="left: 0%;">WARP</div>
          <div class="hud-timeline-step" style="left: 33%;">SNAP-BACK</div>
          <div class="hud-timeline-step" style="left: 39%;">REENTRY</div>
          <div class="hud-timeline-step" style="left: 52%;">STORM</div>
          <div class="hud-timeline-step" style="left: 71%;">LANDING</div>
          <div class="hud-timeline-step" style="left: 97%;">MANUAL</div>
        </div>
      </div>
      
      <!-- Right: Real-time Telemetry Readouts -->
      <div class="hud-top-section telemetry-info">
        <div class="telemetry-bar-item">
          <span class="label">ALTITUDE</span>
          <span id="hud-altitude" class="value">-- m</span>
        </div>
        <div class="telemetry-bar-item">
          <span class="label">VELOCITY</span>
          <span id="hud-velocity" class="value">-- m/s</span>
        </div>
        <div class="telemetry-bar-item">
          <span class="label">VECTOR COORDS</span>
          <span id="hud-coords" class="value">X: --, Y: --, Z: --</span>
        </div>
      </div>
    </div>

    <div class="hud-footer">
      <button id="ignition-trigger" class="hud-btn" disabled>START WARP</button>
    </div>
  </div>

  <!-- Entry Script Module -->
  <script type="module" src="./main.js"></script>

  <!-- Orbit Toggle Button -->
  <!-- Settings Panel -->
  <div id="hud-settings-btn" class="hud-settings-toggle">
    <svg viewBox="0 0 24 24" width="20" height="20">
      <path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
    </svg>
  </div>
  <div id="hud-settings-panel" class="hud-settings-box">
    <div class="settings-title">SYSTEM CONFIG</div>
 
    <div class="settings-row">
      <label for="metallic-slider">METALLIC %</label>
      <input type="range" id="metallic-slider" min="0" max="100" value="99">
      <span id="metallic-val">99%</span>
    </div>
 
    <div class="settings-divider"></div>
    <div class="settings-section-label">ROCKET POSITION</div>
 
    <div class="settings-row settings-row--inline">
      <label>X</label>
      <input type="number" id="rocket-pos-x" value="12.0" step="0.5" class="settings-num">
      <label>Y</label>
      <input type="number" id="rocket-pos-y" value="-1.0" step="0.5" class="settings-num">
      <label>Z</label>
      <input type="number" id="rocket-pos-z" value="-0.5" step="0.5" class="settings-num">
    </div>
 
    <div class="settings-divider"></div>
    <div class="settings-section-label">ROCKET ROTATION (deg)</div>
 
    <div class="settings-row settings-row--inline">
      <label>X</label>
      <input type="number" id="rocket-rot-x" value="90" step="5" class="settings-num">
      <label>Y</label>
      <input type="number" id="rocket-rot-y" value="0" step="5" class="settings-num">
      <label>Z</label>
      <input type="number" id="rocket-rot-z" value="5" step="5" class="settings-num">
    </div>
 
    <button id="settings-apply-btn" class="settings-apply">APPLY TRANSFORMS</button>
    <button id="settings-copy-btn" class="settings-apply" style="margin-top: 4px; background: rgba(0, 240, 255, 0.05);">COPY CURRENT CONFIG</button>
  </div>
</body>
</html>
